<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpustakaan</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;
  --accent:#3b5bdb;--accent-ink:#fff;--ok:#2b8a3e;--warn:#c2680a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141416;--card:#1e1e22;--ink:#ececee;--muted:#9a9aa2;--line:#2c2c32;--accent:#748ffc;--accent-ink:#10131f;--ok:#69db7c;--warn:#ffa94d}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted)}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:grid;gap:8px;grid-template-columns:1fr repeat(4,auto)}
.bar input,.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
@media (max-width:700px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
.count{max-width:1100px;margin:0 auto;padding:0 16px 8px;color:var(--muted);font-size:.9rem}
.grid{max-width:1100px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.cover{aspect-ratio:2/3;background:var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--muted);font-size:.85rem;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:10px 12px 12px}
.meta b{display:block;font-size:.95rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{color:var(--muted);font-size:.82rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
.more{display:block;margin:0 auto 48px;padding:10px 22px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
dialog{border:none;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.d{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px}
@media (max-width:560px){.d{grid-template-columns:1fr}.d .cover{max-width:200px}}
.d h2{margin:0 0 2px;font-size:1.25rem}
.d .by{color:var(--muted);margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:.75rem;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.syn{white-space:pre-line;margin:0 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:.9rem}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.note{font-size:.82rem;margin:10px 0 0}
.note.ok{color:var(--ok)}.note.warn{color:var(--warn)}
.x{position:absolute;right:12px;top:8px;background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 28px}
</style>
</head>
<body>

<header>
  <h1 id="judulSitus">Perpustakaan</h1>
  <p id="subSitus">Katalog buku. File disimpan di Google Drive masing-masing pemilik.</p>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Cari judul, penulis, seri, atau genre...">
  <select id="fGenre"><option value="">Semua genre</option></select>
  <select id="fFormat"><option value="">Semua format</option></select>
  <select id="fBahasa"><option value="">Semua bahasa</option></select>
  <select id="urut">
    <option value="judul">Urut: Judul A-Z</option>
    <option value="baru">Urut: Terbaru ditambah</option>
    <option value="penulis">Urut: Penulis</option>
  </select>
</div>
<div class="count" id="count"></div>
<main class="grid" id="grid"></main>
<button class="more" id="more" hidden>Tampilkan lebih banyak</button>

<dialog id="dlg"><button class="x" id="tutup" aria-label="Tutup">&times;</button><div id="isi"></div></dialog>

<footer id="foot"></footer>

<script>
/* ============ PENGATURAN: edit bagian ini saja ============ */
const CONFIG = {
  judulSitus: "Perpustakaan",
  subSitus: "Katalog buku. File disimpan di Google Drive masing-masing pemilik.",
  // URL CSV dari Google Sheet yang dipublikasikan (File > Bagikan > Publikasikan ke web > CSV).
  // Kosongkan untuk melihat data contoh.
  SHEET_CSV_URL: "",
  perHalaman: 48,
  catatanKaki: "Pastikan kamu punya hak untuk mengakses dan membagikan file yang ditautkan."
};
/* ========================================================== */

const DEMO = `judul,penulis,seri,sinopsis,genre,bahasa,tahun,cover,link_pdf,link_epub,status,kontak
Contoh Buku Satu,Penulis A,,Ini sinopsis contoh. Ganti dengan data dari Sheet kamu.,Fantasi; Petualangan,Indonesia,2021,,https://drive.google.com/file/d/ID_FILE_1/view,https://drive.google.com/file/d/ID_FILE_2/view,publik,
Contoh Buku Dua,Penulis B,Seri X,Sinopsis kedua.,Sastra,Indonesia,2019,,https://drive.google.com/file/d/ID_FILE_3/view,,izin,https://wa.me/6281234567890
Example Book Three,Author C,,Third sample entry.,Sejarah,Inggris,2015,,,https://drive.google.com/file/d/ID_FILE_4/view,publik,`;

const $ = s => document.querySelector(s);
let buku = [], tampil = CONFIG.perHalaman;

/* ---------- CSV parser (mendukung tanda kutip dan baris baru) ---------- */
function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){
      if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false }
      else c+=ch;
    }else{
      if(ch=='"') q=true;
      else if(ch==","){r.push(c);c=""}
      else if(ch=="\n"||ch=="\r"){ if(ch=="\r"&&t[i+1]=="\n")i++; r.push(c);c="";rows.push(r);r=[] }
      else c+=ch;
    }
  }
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()!==""));
}

/* ---------- Bantuan Google Drive ---------- */
function idDrive(s){
  if(!s) return "";
  s=s.trim();
  const m=s.match(/\/d\/([\w-]{20,})/)||s.match(/[?&]id=([\w-]{20,})/)||s.match(/^([\w-]{25,})$/);
  return m?m[1]:"";
}
function urlCover(s){
  s=(s||"").trim();
  if(!s) return "";
  const id=idDrive(s);
  if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w500`;
  return /^https?:\/\//.test(s)?s:"";
}
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const amanUrl = u => /^https?:\/\//i.test((u||"").trim()) ? u.trim() : "";

/* ---------- Muat data ---------- */
async function muat(){
  let teks;
  if(CONFIG.SHEET_CSV_URL){
    try{
      const res=await fetch(CONFIG.SHEET_CSV_URL,{cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      teks=await res.text();
    }catch(e){
      $("#grid").innerHTML='<div class="empty">Gagal memuat data dari Sheet. Periksa URL CSV dan pastikan sudah dipublikasikan.</div>';
      return;
    }
  }else teks=DEMO;

  const rows=parseCSV(teks);
  if(!rows.length) return;
  const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,"_"));
  buku=rows.slice(1).map((r,i)=>{
    const o={_i:i};
    head.forEach((h,k)=>o[h]=(r[k]||"").trim());
    o.genreList=(o.genre||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean);
    o.formatList=[];
    if(amanUrl(o.link_pdf)) o.formatList.push("PDF");
    if(amanUrl(o.link_epub)) o.formatList.push("EPUB");
    return o;
  }).filter(b=>b.judul);
  isiFilter();
  gambar();
}

function isiFilter(){
  const uniq=a=>[...new Set(a)].filter(Boolean).sort((x,y)=>x.localeCompare(y,"id"));
  const set=(sel,vals)=>vals.forEach(v=>sel.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));
  set($("#fGenre"),uniq(buku.flatMap(b=>b.genreList)));
  set($("#fFormat"),uniq(buku.flatMap(b=>b.formatList)));
  set($("#fBahasa"),uniq(buku.map(b=>b.bahasa)));
}

/* ---------- Tampilan daftar ---------- */
function saring(){
  const q=$("#q").value.trim().toLowerCase();
  const g=$("#fGenre").value,f=$("#fFormat").value,l=$("#fBahasa").value;
  let h=buku.filter(b=>{
    if(g&&!b.genreList.includes(g)) return false;
    if(f&&!b.formatList.includes(f)) return false;
    if(l&&b.bahasa!==l) return false;
    if(q){
      const gabung=[b.judul,b.penulis,b.seri,b.genre].join(" ").toLowerCase();
      if(!q.split(/\s+/).every(k=>gabung.includes(k))) return false;
    }
    return true;
  });
  const u=$("#urut").value;
  if(u=="judul") h.sort((a,b)=>a.judul.localeCompare(b.judul,"id"));
  else if(u=="penulis") h.sort((a,b)=>(a.penulis||"").localeCompare(b.penulis||"","id"));
  else h.sort((a,b)=>b._i-a._i);
  return h;
}

function gambar(){
  const h=saring();
  $("#count").textContent=`${h.length} buku`;
  const bagian=h.slice(0,tampil);
  $("#grid").innerHTML=bagian.length?bagian.map(b=>{
    const c=urlCover(b.cover);
    return `<article class="card" data-i="${b._i}">
      <div class="cover">${c?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(c)}" alt="" onerror="this.parentNode.textContent='${esc(b.judul).replace(/'/g,"")}'">`:esc(b.judul)}</div>
      <div class="meta"><b>${esc(b.judul)}</b><span>${esc(b.penulis)}</span></div>
    </article>`}).join(""):'<div class="empty">Tidak ada buku yang cocok.</div>';
  $("#more").hidden=h.length<=tampil;
}

/* ---------- Detail buku ---------- */
function detail(i){
  const b=buku.find(x=>x._i==i); if(!b) return;
  const c=urlCover(b.cover);
  const izin=/izin|akses|private|privat/i.test(b.status||"");
  const pdf=amanUrl(b.link_pdf),epub=amanUrl(b.link_epub),kon=amanUrl(b.kontak);
  const tags=[...b.genreList,b.bahasa,b.tahun,...b.formatList].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  $("#isi").innerHTML=`<div class="d">
    <div class="cover">${c?`<img referrerpolicy="no-referrer" src="${esc(c)}" alt="">`:esc(b.judul)}</div>
    <div>
      <h2>${esc(b.judul)}</h2>
      <p class="by">${esc(b.penulis)}${b.seri?` &middot; ${esc(b.seri)}`:""}</p>
      <div class="tags">${tags}</div>
      <p class="syn">${esc(b.sinopsis)||"Belum ada sinopsis."}</p>
      <div class="btns">
        ${pdf?`<a class="btn" href="${esc(pdf)}" target="_blank" rel="noopener noreferrer">${izin?"Minta akses PDF":"Buka PDF"}</a>`:""}
        ${epub?`<a class="btn" href="${esc(epub)}" target="_blank" rel="noopener noreferrer">${izin?"Minta akses EPUB":"Buka EPUB"}</a>`:""}
        ${izin&&kon?`<a class="btn alt" href="${esc(kon)}" target="_blank" rel="noopener noreferrer">Hubungi pemilik</a>`:""}
      </div>
      ${!pdf&&!epub?'<p class="note warn">Belum ada link file untuk buku ini.</p>':""}
      ${izin?'<p class="note warn">File ini tidak publik. Tombol akan membuka halaman Google Drive, lalu kamu bisa mengirim permintaan akses ke pemiliknya.</p>':(pdf||epub)?'<p class="note ok">File publik, bisa dibuka langsung.</p>':""}
    </div></div>`;
  $("#dlg").showModal();
}

/* ---------- Event ---------- */
["#q","#fGenre","#fFormat","#fBahasa","#urut"].forEach(s=>$(s).addEventListener("input",()=>{tampil=CONFIG.perHalaman;gambar()}));
$("#more").onclick=()=>{tampil+=CONFIG.perHalaman;gambar()};
$("#grid").addEventListener("click",e=>{const k=e.target.closest(".card");if(k)detail(k.dataset.i)});
$("#tutup").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});

document.title=CONFIG.judulSitus;
$("#judulSitus").textContent=CONFIG.judulSitus;
$("#subSitus").textContent=CONFIG.subSitus;
$("#foot").textContent=CONFIG.catatanKaki;
muat();
</script>
</body>
</html>
